# Provider
timeout: 90
memorySize: 1024
role: arn:aws:iam::066927825542:role/ServerlessCoreAPI

# Account specific
accountId: '066927825542'
region: 'eu-west-1'

# Resources
path: connect-09da75a40c78434a8e56ed9f6279c974

subnetIds:
  - subnet-086d78ad2af6a4fad
  - subnet-0eaaa6794fe2c7fe1
securityGroupIds:
  - sg-0d1d38d4cf045ca40

# Events
corsLoginRequired:
  origin: '*'
  headers:
    - Content-Type
    - X-CSRF-Token
    - Authorization
  allowCredentials: true

# Environment variables
environmentVariables:
  AWS_FLAG: 15
  NEST_LOGGER: 'pino'
  TYPEORM_LOAD_MIGRATIONS: true
  NODE_ENV: 'development'
  STAGE: '${env:STAGE}'
  PATH: 'connect-09da75a40c78434a8e56ed9f6279c974'
  MYSQL_HOST: ${ssm:DB_BOXEDOUT_HOST}
  MYSQL_USER: 'admin'
  AWS_REMOTE_KEYID: ${ssm:CRYPT_REMOTE_KEY}
