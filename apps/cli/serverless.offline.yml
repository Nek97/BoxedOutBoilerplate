#
# this file is used to test our lambda function offline (locally or within the pipeline)
#
service: boxedout-core-cli

plugins:
  - serverless-offline
  - serverless-dotenv-plugin

provider:
  name: aws
  environment:
    NODE_ENV: 'development'
    SLS_OFFLINE: true
  lambdaHashingVersion: 20201221 # https://www.serverless.com/framework/docs/deprecations/#LAMBDA_HASHING_VERSION_V2
  apiGateway:
    shouldStartNameWithService: true # https://www.serverless.com/framework/docs/deprecations/#AWS_API_GATEWAY_NAME_STARTING_WITH_SERVICE

custom:
  dotenv:
    # default: project root
    path: ../../.env
  serverless-offline:
    noPrependStageInUrl: true
    httpPort: 3001
    host: '0.0.0.0'
    allowCache: true # needed for graphql

functions:
  reinit:
    runtime: nodejs14.x
    handler: ../../env/dist/apps/cli/src/main.runReinit
    timeout: 30
  migrate:
    runtime: nodejs14.x
    handler: ../../env/dist/apps/cli/src/main.runMigrations
    timeout: 30
  seed:
    runtime: nodejs14.x
    handler: ../../env/dist/apps/cli/src/main.runSeeds
    timeout: 30
