# Provider
timeout: 30
memorySize: 1024
role: arn:aws:iam::595223267069:role/ServerlessCoreAPI

# Account specific
accountId: '595223267069'
region: 'eu-central-1'

# Resources
path: connect-v3

subnetIds:
  - subnet-0f63c6530ba5131fb
  - subnet-04d1291517ad6454b
securityGroupIds:
  - sg-07b31a68343b563af

# Events
corsLoginRequired:
  origin: 'https://account.boxedout.com'
  headers:
    - Content-Type
    - X-CSRF-Token
    - Authorization
  allowCredentials: true

warmup:
  default:
    events:
      - schedule: 'cron(0/1 * * * ? *)'
    concurrency: 5
    prewarm: true
    cleanFolder: false

# Environment variables
environmentVariables:
  REDIS_ENABLED: ${ssm:REDIS_ENABLED}
  AWS_FLAG: 31
  TYPEORM_LOGGING: true
  BASE_PATH: '/connect-v3'
  NEST_LOGGER: 'pino'
  STAGE: '${env:STAGE}'
  NODE_ENV: 'production'
  PATH: 'connect-v3'
  DOMAIN: 'account.boxedout.com'
  GW_MANAGE_PANEL_URL: ${ssm:GW_MANAGE_PANEL_URL}
  MYSQL_HOST: ${ssm:DB_BOXEDOUT_PROXY_HOST}
  MYSQL_USER: ${ssm:DB_CORE_API_USER}
  MYSQL_TOTAL_REPLICATION_NODES: 1
  MYSQL_REPLICA_HOST_1: ${ssm:DB_BOXEDOUT_PROXY_HOST_RO}
  MYSQL_REPLICA_USERNAME_1: ${ssm:DB_CORE_API_USER}
  AWS_REMOTE_KEYID: ${ssm:CRYPT_REMOTE_KEY}
  REDIS_HOST: ${ssm:/BackendCore/prod/RedisCluster/endpoint}
  REDIS_PORT: ${ssm:/BackendCore/prod/RedisCluster/port}
  SENTRY_DSN: ${ssm:SENTRY_DSN}
  SENTRY_RELEASE: ${env:COMMIT_SHA}
  S3_BUCKET_ID: ${env:S3_BUCKET_ID, 'prod-user-identity'}
  S3_BUCKET_POF: ${env:S3_BUCKET_POF, 'prod-proof-of-funds'}
  S3_REGION: ${env:S3_REGION, 'eu-west-1'}
  # KMS_REGION: ${env:KMS_REGION, 'eu-west-1'}
  SQS_REGION: ${env:SQS_REGION, 'eu-west-1'}
  SQS_ENDPOINT: ${env:SQS_ENDPOINT,'https://sqs.eu-west-1.amazonaws.com/503400996940/'}
