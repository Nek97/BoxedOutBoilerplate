name: App CLI Pipeline
on:
  workflow_dispatch:
    inputs:
      skipchecks:
        description: 'Skip check jobs'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master
      - rc
      - dev
    paths:
      - '.github/actions/**'
      - '.github/workflows/app-cli.yml'
      - 'apps/cli/**'
      - 'libs/bitvavo/auth/**'
      - 'libs/bitvavo-libs/**'
      - 'libs/common/**'
      - 'test/**'
      - 'conf/**'
      # execute when root level files change
      - '*'
  pull_request:
    branches-ignore:
      - 'master' # PRs that target master do not execute the action automatically
    paths:
      - '.github/actions/**'
      - '.github/workflows/app-cli.yml'
      - 'apps/cli/**'
      - 'libs/bitvavo/auth/**'
      - 'libs/bitvavo-libs/**'
      - 'libs/common/**'
      - 'test/**'
      - 'conf/**'
      # execute when root level files change
      - '*'

env:
  PROJECT_ID: cli
  NODE_VERSION: 22
  # AWS DEV SECRETS
  AWS_SECRET_DEV_KEY_ID: ${{ secrets.AWS_DEV_ACCESS_KEY_ID }}
  AWS_SECRET_DEV_KEY: ${{ secrets.AWS_DEV_ACCESS_KEY }}
  AWS_ACCOUNT_DEV_ID: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
  # AWS RC SECRETS
  AWS_SECRET_QA_KEY_ID: ${{ secrets.AWS_RC_ACCESS_KEY_ID }}
  AWS_SECRET_QA_KEY: ${{ secrets.AWS_RC_ACCESS_KEY }}
  AWS_ACCOUNT_QA_ID: ${{ secrets.AWS_RC_ACCOUNT_ID }}
  # AWS PROD SECRETS
  AWS_SECRET_PROD_KEY_ID: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
  AWS_SECRET_PROD_KEY: ${{ secrets.AWS_PROD_ACCESS_KEY }}
  AWS_ACCOUNT_PROD_ID: ${{ secrets.AWS_PROD_ACCOUNT_ID }}
  # other
  GITHUB_TOKEN: ${{ secrets.READ_PACKAGE_TOKEN }}
  NODE_ENV: 'pipeline'
  JWT_SECRET_PVT: 'dummydummy'
  JWT_SECRET_PUB: 'dummydummy'
jobs:
  #===========================
  #
  #  PREPARE PIPELINE
  #
  #============================
  prepare-pipeline:
    name: Prepare Pipeline
    runs-on: ubuntu-latest
    outputs:
      github_stage: ${{ steps.bitvavo.outputs.github_stage }}
      project_id: ${{ steps.bitvavo.outputs.project_id }}
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache global npm
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-global-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Cache local node_modules
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-modules
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - name: Run Bitvavo actions
        id: bitvavo
        with:
          run-install: true
          project-id: ${{ env.PROJECT_ID }}
        uses: ./.github/actions/bitvavo-actions
      # to make sure that the bitvavo actions worked
      - name: Check npm version
        run: npm --version

  #===========================
  #
  #  RUN PARALLEL JOBS
  #
  #============================
  linter:
    if: github.event.inputs.skipchecks != 'true'
    name: Linter Checks
    needs: prepare-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Restore node_modules cache
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-modules
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - name: Run Bitvavo actions
        id: bitvavo
        with:
          project-id: ${{ env.PROJECT_ID }}
        uses: ./.github/actions/bitvavo-actions
      - name: Lint check
        run: npm run lint:path --lintpath=apps/${{ env.PROJECT_ID }};

  test-unit:
    if: github.event.inputs.skipchecks != 'true'
    name: Unit Tests
    needs: prepare-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Restore node_modules cache
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-modules
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - name: Run Bitvavo actions
        id: bitvavo
        with:
          project-id: ${{ env.PROJECT_ID }}
        uses: ./.github/actions/bitvavo-actions
      - name: Test coverage
        run: npm run test:cov -- --ci apps/${{ env.PROJECT_ID }};
      - name: Upload coverage artifacts
        if: steps.bitvavo.outputs.github_stage != 'other' # deploy only for dev, qa and prod
        uses: actions/upload-artifact@master
        with:
          name: apps-${{ env.PROJECT_ID }}
          path: docs/compodoc/jestcoverage/apps/${{ env.PROJECT_ID }}
          retention-days: 80

  dry-runs:
    if: github.event.inputs.skipchecks != 'true'
    name: Dry runs
    needs: prepare-pipeline
    runs-on: ubuntu-latest
    services:
      mysql:
        image: ghcr.io/bitvavo/mysql:5.7.4
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.READ_PACKAGE_TOKEN }}
        env:
          MYSQL_DATABASE: bitvavo
          MYSQL_ROOT_PASSWORD: 'xs2mysql'
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Restore node_modules cache
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-modules
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - name: Run Bitvavo actions
        id: bitvavo
        with:
          project-id: ${{ env.PROJECT_ID }}
        uses: ./.github/actions/bitvavo-actions
      - name: Dry runs
        env:
          MYSQL_HOST: '127.0.0.1'
          MYSQL_USER: 'root'
          MYSQL_ROOT_PASSWORD: 'xs2mysql'
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          npm run typeorm:initdb;
          npm run typeorm:migrate;
          npm run typeorm:reseed;

  image-creation:
    env:
      DOCKER_BUILDKIT: 1
    name: Image creation
    needs: prepare-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Run Bitvavo actions
        id: bitvavo
        with:
          project-id: ${{ env.PROJECT_ID }}
        uses: ./.github/actions/bitvavo-actions
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1.5.5
        with:
          aws-access-key-id: ${{ env.AWS_SECRET_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PUBLISH_TOKEN }}
      - name: Pull image for cache
        env:
          IMAGE_TAG: ${{ env.PROJECT_ID }}-latest
        run: docker pull ghcr.io/bitvavo/backend-core-api/${{ env.PROJECT_ID }}:${IMAGE_TAG} || true
      - name: Build image
        env:
          IMAGE_TAG_VERSION: ${{ env.CORE_API_VERSION }}
          IMAGE_TAG_LATEST: ${{ env.PROJECT_ID }}-latest
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg DOCKER_ENV=${{ env.DOCKER_ENV}} \
            --build-arg GITHUB_TOKEN=${{ secrets.PUBLISH_TOKEN }} \
            --build-arg APP_ID=${{ env.PROJECT_ID }} \
            --cache-from=ghcr.io/bitvavo/backend-core-api/${{ env.PROJECT_ID }}:${{ env.IMAGE_TAG_LATEST }} \
            --target distribution-istio \
            -t ghcr.io/bitvavo/backend-core-api/${{ env.PROJECT_ID }}:${{ env.IMAGE_TAG_LATEST }} \
            -t ghcr.io/bitvavo/backend-core-api/${{ env.PROJECT_ID }}:${{ env.IMAGE_TAG_VERSION }} .
      - name: Deploy image to Amazon ECR and Github
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backend-core-api
          IMAGE_TAG: ${{ env.PROJECT_ID }}-latest
        if: steps.bitvavo.outputs.github_stage != 'other' # deploy only for dev, qa and prod
        run: |
          docker push --all-tags ghcr.io/bitvavo/backend-core-api/${{ env.PROJECT_ID }}

