  k8s-deploy:
    name: Deploy app on k8s
    needs: [prepare-pipeline, test-unit, linter, dry-runs, image-creation]
    concurrency: ci-${{ github.workflow }}-deploy-${{ github.ref }}
    # deploy only for dev, qa and prod
    # verbose condition needed because of this limitation: https://github.com/actions/runner/issues/491#issuecomment-850884422
    # also, the wildcard can't work in this case because we can have 1 on success and the other on skipped
    if: |
      always() &&
      (needs.prepare-pipeline.result == 'success') &&
      (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') &&
      (needs.linter.result == 'success' || needs.linter.result == 'skipped') &&
      (needs.dry-runs.result == 'success' || needs.dry-runs.result == 'skipped') &&
      (needs.image-creation.result == 'success' || needs.image-creation.result == 'skipped') &&
      contains('
        refs/heads/dev
        refs/heads/master
        refs/heads/rc
        ', github.ref)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Set k8s cli job tag
        id: k8s-setup
        with:
          k8s_config_token: ${{ secrets.K8S_CONFIG_TOKEN }}
          tag_path: .jobs[].image.tag
          yml_filename: manage-panel
          push_commit: false
        uses: ./.github/actions/bitvavo-actions/k8s-deploy

      #
      # Because of this issue: https://github.com/kubernetes/kubernetes/issues/89657#issuecomment-1038279669
      # We need to change the name of the job everytime to destroy the previous one
      # (can't use ttlSecondsAfterFinished, it causes a loop in ArgoCD)
      #
      # NOTE about the job name: a lowercase RFC 1123 subdomain must consist of lower case alphanumeric characters, '-' or '.',
      # and must start and end with an alphanumeric character
      # (e.g. 'example.com', regex used for validation is '[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*')
      #
      - name: Change CLI job name and deploy
        env:
          IMAGE_TAG_VERSION: ${{ steps.k8s-setup.outputs.package_version }}
          BRANCH_NAME: ${{ steps.k8s-setup.outputs.github_branch }}
        shell: bash
        run: |
          cd k8s-config
          FOLDER=${{ steps.k8s-setup.outputs.github_stage }}
          git config --local user.email "devops@github.com"
          git config --local user.name "${{ github.actor }}"
          CUR_DATE=$(date +%Y-%m-%d-%H-%M-%S)
          export VALUES=$(yq e '.spec.source.helm.values' "$FOLDER/internaltools/manage-panel.yaml" | yq e ".jobs[].name=\"exec-cli-prep-$CUR_DATE\"" -) 
          [ ! -z "$VALUES" ] && yq e -i '.spec.source.helm.values=strenv(VALUES)'  "$FOLDER/internaltools/manage-panel.yaml" || exit 1
          export VALUES=$(yq e '.spec.source.helm.values' "$FOLDER/internaltools/manage-panel.yaml" | yq e ".deployment.initContainers[].command[] |= sub(\"manage-panel-exec-cli-prep-([^\s]*) \", \"manage-panel-exec-cli-prep-$CUR_DATE \")" -);
          [ ! -z "$VALUES" ] && yq e -i '.spec.source.helm.values=strenv(VALUES)'  "$FOLDER/internaltools/manage-panel.yaml" || exit 1
          git add "$FOLDER/internaltools/manage-panel.yaml"
          git commit -sm "chore(internaltools/${{ env.PROJECT_ID }}): ${{ env.IMAGE_TAG_VERSION }} from ${{ github.repository }}:${{ env.BRANCH_NAME }}"
          git push
