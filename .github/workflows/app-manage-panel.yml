  #     (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') &&
  #     (needs.linter.result == 'success' || needs.linter.result == 'skipped') &&
  #     (needs.dry-runs.result == 'success' || needs.dry-runs.result == 'skipped') &&
  #     contains('
  #     refs/heads/dev
  #     refs/heads/master
  #     refs/heads/rc
  #     ', github.ref)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Use Node.js
  #       uses: actions/setup-node@v1
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #     - name: Checkout
  #       uses: actions/checkout@v2
  #       with:
  #         submodules: 'recursive'
  #         token: ${{ secrets.PUBLISH_TOKEN }}
  #     - name: Download build artifacts
  #       uses: actions/download-artifact@master
  #       with:
  #         name: build-${{ env.PROJECT_ID }}
  #         path: env/dist/apps/${{ env.PROJECT_ID }}/bundle
  #     - name: Run Bitvavo actions
  #       id: bitvavo
  #       with:
  #         project-id: ${{ env.PROJECT_ID }}
  #       uses: ./.github/actions/bitvavo-actions
  #     - name: Configure AWS credentials
  #       uses: aws-actions/configure-aws-credentials@v1.5.5
  #       with:
  #         aws-access-key-id: ${{ env.AWS_SECRET_KEY_ID }}
  #         aws-secret-access-key: ${{ env.AWS_SECRET_KEY }}
  #         aws-region: ${{ env.AWS_REGION }}
  #     - name: Deploy to SLS 🚀
  #       env:
  #         AWS_ACCESS_KEY_ID: ${{ env.AWS_SECRET_KEY_ID }}
  #         AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_KEY }}
  #         NODE_ENV: ${{ env.DOCKER_ENV}}
  #       run: |
  #         cd apps/${{ env.PROJECT_ID }};
  #         npm run sls:deploy

  k8s-deploy:
    name: Deploy app on k8s
    needs:
      [prepare-pipeline, test-e2e, test-unit, linter, dry-runs, image-creation]
    concurrency: ci-${{ github.workflow }}-deploy-${{ github.ref }}
    # deploy only for dev, qa and prod
    # verbose condition needed because of this limitation: https://github.com/actions/runner/issues/491#issuecomment-850884422
    # also, the wildcard can't work in this case because we can have 1 on success and the other on skipped
    if: |
      always() &&
      (needs.prepare-pipeline.result == 'success') &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped') &&
      (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') &&
      (needs.linter.result == 'success' || needs.linter.result == 'skipped') &&
      (needs.dry-runs.result == 'success' || needs.dry-runs.result == 'skipped') &&
      (needs.image-creation.result == 'success' || needs.image-creation.result == 'skipped') &&
      contains('
      refs/heads/dev
      refs/heads/master
      refs/heads/rc
      ', github.ref)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Deploy on k8s
        with:
          k8s_config_token: ${{ secrets.K8S_CONFIG_TOKEN }}
        uses: ./.github/actions/bitvavo-actions/k8s-deploy
