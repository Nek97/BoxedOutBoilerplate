name: Bitvavo libs pipeline
on:
  workflow_dispatch:
    inputs:
      skipchecks:
        description: 'Skip check jobs.'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master
      - rc
      - dev
    paths:
      - '.github/actions/**'
      - '.github/workflows/libs.yml'
      - 'libs/**'
      - 'test/**'
      - 'conf/**'
      # execute when root level files change
      - '*'
  pull_request:
    branches-ignore:
      - 'master' # PRs that target master do not execute the action automatically
    paths:
      - '.github/actions/**'
      - '.github/workflows/libs.yml'
      - 'libs/**'
      - 'test/**'
      - 'conf/**'
      # execute when root level files change
      - '*'

env:
  PROJECT_ID: libs
  NODE_VERSION: 16
  # other
  GITHUB_TOKEN: ${{ secrets.READ_PACKAGE_TOKEN }}
  NODE_ENV: 'pipeline'
  JWT_SECRET_PVT: 'dummydummy'
  JWT_SECRET_PUB: 'dummydummy'
jobs:
  #===========================
  #
  #  PREPARE PIPELINE
  #
  #============================
  prepare-pipeline:
    name: Prepare pipeline
    runs-on: ubuntu-latest
    outputs:
      github_stage: ${{ steps.bitvavo.outputs.github_stage }}
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache global npm
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-global-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Cache local node_modules
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-modules
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - name: Run Bitvavo actions
        id: bitvavo
        with:
          run-install: true
          aws-setup: false
        uses: ./.github/actions/bitvavo-actions
      # to make sure that the bitvavo actions worked
      - name: Check npm version
        run: npm --version

  #===========================
  #
  #  RUN PARALLEL JOBS
  #
  #============================
  linter:
    if: github.event.inputs.skipchecks != 'true'
    name: Linter checks
    needs: prepare-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Restore node_modules cache
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-modules
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - name: Run Bitvavo actions
        id: bitvavo
        with:
          project-id: ${{ env.PROJECT_ID }}
          aws-setup: false
        uses: ./.github/actions/bitvavo-actions
      - name: Lint check
        run: npm run lint:path --lintpath=libs;

  test-unit-bitvavo:
    if: github.event.inputs.skipchecks != 'true'
    name: Bitvavo modules unit tests
    needs: prepare-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Restore node_modules cache
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-modules
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - name: Run Bitvavo actions
        id: bitvavo
        with:
          aws-setup: false
        uses: ./.github/actions/bitvavo-actions
      - name: Test coverage
        run: npm run test:cov -- --ci libs/bitvavo/;
      - name: Upload coverage artifacts
        if: steps.bitvavo.outputs.github_stage != 'other' # deploy only for dev, qa and prod
        uses: actions/upload-artifact@master
        with:
          name: libs-bitvavo
          path: docs/compodoc/jestcoverage/libs/bitvavo
          retention-days: 80

  test-unit-bitvavo-libs:
    if: github.event.inputs.skipchecks != 'true'
    name: Bitvavo libs unit tests
    needs: prepare-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Restore node_modules cache
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-modules
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - name: Run Bitvavo actions
        id: bitvavo
        with:
          aws-setup: false
        uses: ./.github/actions/bitvavo-actions
      - name: Test coverage
        run: npm run test:cov -- --ci libs/bitvavo-libs/;
      - name: Upload coverage artifacts
        if: steps.bitvavo.outputs.github_stage != 'other' # deploy only for dev, qa and prod
        uses: actions/upload-artifact@master
        with:
          name: libs-bitvavo-libs
          path: docs/compodoc/jestcoverage/libs/bitvavo-libs
          retention-days: 80

  test-unit-common:
    if: github.event.inputs.skipchecks != 'true'
    name: Common libs unit tests
    needs: prepare-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          token: ${{ secrets.PUBLISH_TOKEN }}
      - name: Restore node_modules cache
        uses: actions/cache@v3
        env:
          cache-name: cache-${{ env.PROJECT_ID }}-modules
        with:
          path: 'node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - name: Run Bitvavo actions
        id: bitvavo
        with:
          aws-setup: false
        uses: ./.github/actions/bitvavo-actions
      - name: Test coverage
        run: npm run test:cov -- --ci libs/common/;
      - name: Upload coverage artifacts
        if: steps.bitvavo.outputs.github_stage != 'other' # deploy only for dev, qa and prod
        uses: actions/upload-artifact@master
        with:
          name: libs-common
          path: docs/compodoc/jestcoverage/libs/common
          retention-days: 80
